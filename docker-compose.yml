services:
  postgres:
    image: postgres:16-alpine
    container_name: retail_sim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retail_sim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_sim"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
